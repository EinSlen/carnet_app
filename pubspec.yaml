name: carnet_animal
description: "Carnet de santé animal - local-first, pour animaux malades chroniques et âgés."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestion d'état + injection de dépendances
  flutter_riverpod: ^2.6.1

  # Base de données locale (100% hors-ligne, pas de codegen)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Rappels fiables = LA promesse coeur
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1

  # Affichage / formats
  intl: ^0.20.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1

  # Export PDF "prêt pour le véto"
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
